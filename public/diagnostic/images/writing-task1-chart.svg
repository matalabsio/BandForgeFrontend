<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Percentage of commuters using different modes of transport in four cities, 2022">
  <rect width="560" height="320" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Figure 1: Percentage of commuters using different modes of transport in four cities, 2022</text>

  <!-- Plot area -->
  <line x1="52" y1="40" x2="52" y2="246" stroke="#94a3b8" stroke-width="1.25"/>
  <line x1="52" y1="246" x2="530" y2="246" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="16" y="143" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" transform="rotate(-90 16 143)">Percentage (%)</text>

  <!-- Grid and Y ticks -->
  <g font-family="system-ui,sans-serif" font-size="10" fill="#64748b">
    <line x1="52" y1="246" x2="530" y2="246" stroke="#e2e8f0"/><text x="44" y="249" text-anchor="end">0</text>
    <line x1="52" y1="216.6" x2="530" y2="216.6" stroke="#e2e8f0"/><text x="44" y="219.6" text-anchor="end">10</text>
    <line x1="52" y1="187.1" x2="530" y2="187.1" stroke="#e2e8f0"/><text x="44" y="190.1" text-anchor="end">20</text>
    <line x1="52" y1="157.7" x2="530" y2="157.7" stroke="#e2e8f0"/><text x="44" y="160.7" text-anchor="end">30</text>
    <line x1="52" y1="128.3" x2="530" y2="128.3" stroke="#e2e8f0"/><text x="44" y="131.3" text-anchor="end">40</text>
    <line x1="52" y1="98.9" x2="530" y2="98.9" stroke="#e2e8f0"/><text x="44" y="101.9" text-anchor="end">50</text>
    <line x1="52" y1="69.4" x2="530" y2="69.4" stroke="#e2e8f0"/><text x="44" y="72.4" text-anchor="end">60</text>
    <line x1="52" y1="40" x2="530" y2="40" stroke="#e2e8f0"/><text x="44" y="43" text-anchor="end">70</text>
  </g>

  <!-- Bars -->
  <!-- Tokyo -->
  <rect x="88" y="204.9" width="9" height="41.1" fill="#1e3a5f"/>
  <rect x="99" y="62.6" width="9" height="183.4" fill="#0d9488"/>
  <rect x="110" y="198.9" width="9" height="47.1" fill="#f59e0b"/>
  <rect x="121" y="222.6" width="9" height="23.4" fill="#d1d5db"/>
  <!-- Berlin -->
  <rect x="204" y="163.4" width="9" height="82.6" fill="#1e3a5f"/>
  <rect x="215" y="124.9" width="9" height="121.1" fill="#0d9488"/>
  <rect x="226" y="181.1" width="9" height="64.9" fill="#f59e0b"/>
  <rect x="237" y="218.9" width="9" height="27.1" fill="#d1d5db"/>
  <!-- Sao Paulo -->
  <rect x="320" y="107.7" width="9" height="138.3" fill="#1e3a5f"/>
  <rect x="331" y="134.3" width="9" height="111.7" fill="#0d9488"/>
  <rect x="342" y="231.4" width="9" height="14.6" fill="#f59e0b"/>
  <rect x="353" y="216.6" width="9" height="29.4" fill="#d1d5db"/>
  <!-- Toronto -->
  <rect x="436" y="93.1" width="9" height="152.9" fill="#1e3a5f"/>
  <rect x="447" y="154.9" width="9" height="91.1" fill="#0d9488"/>
  <rect x="458" y="225.4" width="9" height="20.6" fill="#f59e0b"/>
  <rect x="469" y="216.6" width="9" height="29.4" fill="#d1d5db"/>

  <!-- City labels -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#334155" text-anchor="middle">
    <text x="109" y="268">Tokyo</text>
    <text x="225" y="268">Berlin</text>
    <text x="341" y="268">Sao Paulo</text>
    <text x="457" y="268">Toronto</text>
  </g>

  <!-- Legend -->
  <g font-family="system-ui,sans-serif" font-size="10" fill="#475569">
    <rect x="120" y="286" width="10" height="10" fill="#1e3a5f"/><text x="136" y="295">Car</text>
    <rect x="190" y="286" width="10" height="10" fill="#0d9488"/><text x="206" y="295">Public Transport</text>
    <rect x="332" y="286" width="10" height="10" fill="#f59e0b"/><text x="348" y="295">Cycling</text>
    <rect x="410" y="286" width="10" height="10" fill="#d1d5db"/><text x="426" y="295">Walking</text>
  </g>
</svg>
