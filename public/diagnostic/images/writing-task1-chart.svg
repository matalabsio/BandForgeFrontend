<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 268" role="img" aria-label="Percentage of commuters using different modes of transport in four cities, 2022">
  <rect width="520" height="268" fill="#ffffff"/>
  <text x="260" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#0f172a">Figure 1: Percentage of commuters using different modes of transport in four cities, 2022</text>
  <!-- Y-axis -->
  <line x1="40" y1="12" x2="40" y2="216" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="12" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" transform="rotate(-90 12 114)">Percentage (%)</text>
  <!-- X-axis -->
  <line x1="40" y1="216" x2="508" y2="216" stroke="#94a3b8" stroke-width="1.25"/>
  <!-- Grid + Y labels -->
  <g font-family="system-ui,sans-serif" font-size="9" fill="#64748b">
    <line x1="40" y1="216" x2="508" y2="216" stroke="#e2e8f0"/>
    <text x="34" y="219" text-anchor="end">0</text>
    <line x1="40" y1="187" x2="508" y2="187" stroke="#e2e8f0"/>
    <text x="34" y="190" text-anchor="end">10</text>
    <line x1="40" y1="158" x2="508" y2="158" stroke="#e2e8f0"/>
    <text x="34" y="161" text-anchor="end">20</text>
    <line x1="40" y1="129" x2="508" y2="129" stroke="#e2e8f0"/>
    <text x="34" y="132" text-anchor="end">30</text>
    <line x1="40" y1="100" x2="508" y2="100" stroke="#e2e8f0"/>
    <text x="34" y="103" text-anchor="end">40</text>
    <line x1="40" y1="71" x2="508" y2="71" stroke="#e2e8f0"/>
    <text x="34" y="74" text-anchor="end">50</text>
    <line x1="40" y1="42" x2="508" y2="42" stroke="#e2e8f0"/>
    <text x="34" y="45" text-anchor="end">60</text>
    <line x1="40" y1="13" x2="508" y2="13" stroke="#e2e8f0"/>
    <text x="34" y="16" text-anchor="end">70</text>
  </g>
  <!-- Bars: cities Tokyo, Berlin, São Paulo, Toronto; series Car, Public, Cycling, Walking -->
  <!-- plotH=204, yMax=70, bar area y=12 to y=216 -->
  <!-- Tokyo x~98 -->
  <rect x="62" y="175.2" width="7" height="40.8" fill="#1e3a5f"/>
  <rect x="71" y="34.9" width="7" height="181.1" fill="#0d9488"/>
  <rect x="80" y="169.3" width="7" height="46.7" fill="#f59e0b"/>
  <rect x="89" y="192.7" width="7" height="23.3" fill="#d1d5db"/>
  <!-- Berlin x~205 -->
  <rect x="169" y="134.4" width="7" height="81.6" fill="#1e3a5f"/>
  <rect x="178" y="96.3" width="7" height="119.7" fill="#0d9488"/>
  <rect x="187" y="151.8" width="7" height="64.2" fill="#f59e0b"/>
  <rect x="196" y="189.8" width="7" height="26.2" fill="#d1d5db"/>
  <!-- São Paulo x~312 -->
  <rect x="276" y="78.9" width="7" height="137.1" fill="#1e3a5f"/>
  <rect x="285" y="105.1" width="7" height="110.9" fill="#0d9488"/>
  <rect x="294" y="201.4" width="7" height="14.6" fill="#f59e0b"/>
  <rect x="303" y="186.9" width="7" height="29.1" fill="#d1d5db"/>
  <!-- Toronto x~419 -->
  <rect x="383" y="64.3" width="7" height="151.7" fill="#1e3a5f"/>
  <rect x="392" y="125.5" width="7" height="90.5" fill="#0d9488"/>
  <rect x="401" y="195.5" width="7" height="20.5" fill="#f59e0b"/>
  <rect x="410" y="186.9" width="7" height="29.1" fill="#d1d5db"/>
  <!-- City labels -->
  <g font-family="system-ui,sans-serif" font-size="10" fill="#334155" text-anchor="middle">
    <text x="98" y="232">Tokyo</text>
    <text x="205" y="232">Berlin</text>
    <text x="312" y="232">São Paulo</text>
    <text x="419" y="232">Toronto</text>
  </g>
  <!-- Legend -->
  <g font-family="system-ui,sans-serif" font-size="9" fill="#475569">
    <rect x="300" y="248" width="8" height="8" fill="#1e3a5f"/><text x="312" y="256">Car</text>
    <rect x="350" y="248" width="8" height="8" fill="#0d9488"/><text x="362" y="256">Public Transport</text>
    <rect x="440" y="248" width="8" height="8" fill="#f59e0b"/><text x="452" y="256">Cycling</text>
    <rect x="490" y="248" width="8" height="8" fill="#d1d5db"/><text x="502" y="256">Walking</text>
  </g>
</svg>
